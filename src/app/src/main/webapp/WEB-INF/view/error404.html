<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link rel="icon" type="image/png" href="/weather-app/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sora', sans-serif;
            background: #f0f4f8;
            color: #1a202c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center { text-align: center; }

        .code {
            font-size: 4rem;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 8px;
        }

        p {
            font-size: 0.88rem;
            color: #a0aec0;
            margin-bottom: 28px;
        }

        a {
            padding: 10px 24px;
            background: #3b82f6;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background .15s;
        }
        a:hover { background: #2563eb; }
    </style>
</head>
<body>
<div class="center">
    <div class="code">404</div>
    <h1>Endpoint not found</h1>
    <p>Use a correct one....</p>
    <a th:href="@{/}">Go back</a>
</div>
</body>
</html>
