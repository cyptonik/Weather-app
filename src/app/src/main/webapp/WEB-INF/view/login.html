<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link rel="icon" type="image/png" href="/weather-app/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1a202c;
            --muted: #718096;
            --accent: #3b82f6;
            --danger: #ef4444;
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.07);
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-sub {
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: .03em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            font-family: 'Sora', sans-serif;
            font-size: 0.93rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            outline: none;
            transition: border-color .15s, background .15s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--accent);
            background: #fff;
        }

        .btn-submit {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            font-family: 'Sora', sans-serif;
            font-size: 0.93rem;
            font-weight: 500;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s;
        }
        .btn-submit:hover { background: #2563eb; }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 14px;
            text-align: center;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="card-title">Welcome back</h1>
        <p class="card-sub">Log in to view your locations</p>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="login">Username</label>
                <input type="text" id="login" name="login" required autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <input type="submit" class="btn-submit" value="Log in">
        </form>

        <p th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></p>

        <p class="footer-link">No account? <a th:href="@{/register}">Register</a></p>
    </div>
</body>
</html>
