<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather</title>
    <link rel="icon" type="image/png" href="/weather-app/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1a202c;
            --muted: #718096;
            --accent: #3b82f6;
            --accent-light: #eff6ff;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 16px 48px;
        }

        header {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            margin-bottom: 36px;
        }

        .greeting {
            font-size: 0.95rem;
            color: var(--muted);
        }
        .greeting span {
            color: var(--text);
            font-weight: 600;
        }

        .logout-link {
            font-size: 0.85rem;
            color: var(--muted);
            text-decoration: none;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all .15s;
        }
        .logout-link:hover {
            color: var(--text);
            border-color: #cbd5e0;
            background: var(--surface);
        }

        main {
            max-width: 760px;
            margin: 0 auto;
        }

        /* Search */
        .search-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            margin-bottom: 28px;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .search-row input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            font-family: 'Sora', sans-serif;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--bg);
            transition: border-color .15s;
        }
        .search-row input[type="text"]:focus {
            border-color: var(--accent);
            background: #fff;
        }

        .btn {
            padding: 10px 20px;
            font-family: 'Sora', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all .15s;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { background: #2563eb; }

        .btn-ghost {
            background: transparent;
            color: var(--danger);
            border: 1px solid #fecaca;
            font-size: 0.82rem;
            padding: 6px 12px;
        }
        .btn-ghost:hover { background: #fef2f2; }

        .btn-save {
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid #bfdbfe;
            font-size: 0.82rem;
            padding: 6px 12px;
        }
        .btn-save:hover { background: #dbeafe; }

        .error-message {
            color: var(--danger);
            font-size: 0.88rem;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .error-message::before { content: '⚠'; }

        /* Section label */
        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        /* Weather table */
        .weather-table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--muted);
        }

        td {
            padding: 12px 14px;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }

        tr:hover td { background: #fafbfc; }

        .temp-cell {
            font-family: 'DM Mono', monospace;
            font-weight: 500;
            color: var(--accent);
        }

        .coord-cell {
            font-family: 'DM Mono', monospace;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .weather-icon img {
            width: 36px;
            height: 36px;
            display: block;
        }

        td form { margin: 0; }
    </style>
</head>
<body>
    <header>
        <p class="greeting">Hello, <span th:text="${login}">User</span></p>
        <a class="logout-link" href="/weather-app/logout">Log out</a>
    </header>

    <main>
        <div class="search-card">
            <form th:action="@{/weather}" method="post">
                <div class="search-row">
                    <input type="text" id="city" name="city" placeholder="Search city..." required>
                    <input type="submit" class="btn btn-primary" value="Search">
                </div>
            </form>
            <p th:if="${errorMessage}" class="error-message">
                <span th:text="${errorMessage}"></span>
            </p>
        </div>

        <div th:if="${not #lists.isEmpty(foundWeathers)}">
            <p class="section-label">Search results</p>
            <div class="weather-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>City</th>
                            <th>Lon / Lat</th>
                            <th>Description</th>
                            <th>Temp</th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="w : ${foundWeathers}">
                            <td th:text="${w.name}">City</td>
                            <td class="coord-cell">
                                <span th:text="${w.coord.lon}">0</span> /
                                <span th:text="${w.coord.lat}">0</span>
                            </td>
                            <td th:text="${w.weather.get(0).description}">clear</td>
                            <td class="temp-cell"><span th:text="${w.main.temp}">0</span>°C</td>
                            <td class="weather-icon">
                                <img th:src="'https://openweathermap.org/img/wn/' + ${w.weather[0].icon} + '@2x.png'" alt="">
                            </td>
                            <td>
                                <form th:action="@{/saveWeather}" method="post">
                                    <input type="hidden" name="lon" th:value="${w.coord.lon}">
                                    <input type="hidden" name="lat" th:value="${w.coord.lat}">
                                    <input type="hidden" name="city" th:value="${w.name}">
                                    <input type="submit" class="btn btn-save" value="Save">
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${not #lists.isEmpty(savedWeathers)}">
            <p class="section-label">My locations</p>
            <div class="weather-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>City</th>
                            <th>Lon / Lat</th>
                            <th>Description</th>
                            <th>Temp</th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sw : ${savedWeathers}">
                            <td th:text="${sw.response.name}">City</td>
                            <td class="coord-cell">
                                <span th:text="${sw.response.coord.lon}">0</span> /
                                <span th:text="${sw.response.coord.lat}">0</span>
                            </td>
                            <td th:text="${sw.response.weather.get(0).description}">clear</td>
                            <td class="temp-cell"><span th:text="${sw.response.main.temp}">0</span>°C</td>
                            <td class="weather-icon">
                                <img th:src="'https://openweathermap.org/img/wn/' + ${sw.response.weather[0].icon} + '@2x.png'" alt="">
                            </td>
                            <td>
                                <form th:action="@{/deleteWeather}" method="post">
                                    <input type="hidden" name="locationId" th:value="${sw.locationId}">
                                    <input type="submit" class="btn btn-ghost" value="Delete">
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
